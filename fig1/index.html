<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curva de carga animada</title>
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#44113C;
    --primary-soft:#f4eef3;
    --muted:#867a84;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,sans-serif;background:#fff;color:#2a0a26;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1140px;margin:0 auto;padding:clamp(14px,3vw,36px) clamp(14px,3vw,36px) 40px}

  /* Barra superior: indicación + repetir */
  .bar{
    display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;
    margin-bottom:clamp(12px,2vw,22px);animation:fadeDown .7s .1s cubic-bezier(.2,.8,.2,1) both;
  }
  .tip{font-size:.85rem;color:var(--muted);font-weight:400;text-align:right}
  .replay{
    display:inline-flex;align-items:center;gap:10px;cursor:pointer;
    background:var(--primary-soft);color:var(--primary);border:1.5px solid #e6d8e3;border-radius:999px;
    padding:10px 20px 10px 12px;font:500 .9rem 'Poppins',sans-serif;transition:.25s;
  }
  .replay .ic{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;transition:transform .5s}
  .replay:hover{background:var(--primary);color:#fff}
  .replay:hover .ic{background:#fff;color:var(--primary);transform:rotate(-360deg)}
  .replay:focus-visible{outline:3px solid rgba(68,17,60,.35);outline-offset:3px}

  /* Figura */
  .stage{max-width:1100px;margin:0 auto}
  .stage svg{display:block;width:100%;height:auto}
  .js .stage[data-state="pre"] svg{visibility:hidden}

  /* Estados iniciales (ocultos) y animaciones; los retardos llegan por --d desde el script */
  .f,.u,.l,.p,.h{opacity:0}
  .u,.l,.p{transform-box:fill-box}
  .u{transform-origin:50% 100%}
  .l{transform-origin:0% 50%}
  .p{transform-origin:50% 60%}
  .w{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0)}

  .play .f{animation:fade .7s ease both;animation-delay:var(--d,0s)}
  .play .u{animation:glyphUp .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
  .play .l{animation:glyphLeft .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
  .play .p{animation:glyphPop .75s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d,0s)}
  .play .h{animation:hatchIn .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
  .play .w{animation:wipe .9s cubic-bezier(.3,.7,.2,1) both;animation-delay:var(--d,0s)}

  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes glyphUp{from{opacity:0;transform:translateY(55%) scale(.7)}to{opacity:1;transform:none}}
  @keyframes glyphLeft{from{opacity:0;transform:translateX(-45%)}to{opacity:1;transform:none}}
  @keyframes glyphPop{0%{opacity:0;transform:scale(.2)}65%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:none}}
  @keyframes hatchIn{from{opacity:0;transform:translate(-42px,42px)}to{opacity:1;transform:none}}
  @keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes ring{0%{transform:scale(.6);opacity:.85}100%{transform:scale(2.8);opacity:0}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}

  /* Punto que traza la curva */
  .tracer{opacity:0;transition:opacity .5s;pointer-events:none}
  .tracer .guide{stroke:rgb(8,0,255);stroke-width:.8;stroke-dasharray:2.2,2.2;opacity:.45}
  .tracer .foot{fill:rgb(8,0,255);opacity:.55}
  .tracer .dot{fill:rgb(8,0,255);stroke:#fff;stroke-width:1.2}
  .tracer .ring{fill:none;stroke:rgb(8,0,255);stroke-width:.9;transform-box:fill-box;transform-origin:center;animation:ring 1.1s ease-out infinite}

  /* Resaltado interactivo */
  [data-ref]{transition:opacity .3s}
  [data-ref].dim{opacity:.14}
  .refg{cursor:pointer}
  .refbar{transition:stroke-width .3s}
  .emph .refbar{stroke:var(--c);stroke-width:2.4px}
  .lbl.emph path{stroke:var(--c);stroke-width:.014px}
  .emph path.h{stroke-width:2.4px!important}
  .lbl{cursor:pointer}

  @media (max-width:560px){
    .bar{justify-content:stretch;flex-direction:column-reverse;align-items:stretch;gap:10px}
    .tip{text-align:center}
    .replay{justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){
    .stage.play *{animation-duration:.01ms!important;animation-delay:0s!important}
    .tracer .ring{animation:none}
  }
</style>
</head>

    <span class="tip">Pase el cursor sobre las etiquetas para resaltarlas</span>
    <button class="replay" id="replay" type="button">
      <span class="ic">

      </span>
      Repetir animación
    </button>
  </div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const svg = document.getElementById('fig');
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Línea de tiempo (en segundos). Se puede ajustar libremente. */
  const T = {
    frame:0, title:0.30, plotBox:0.50, axes:0.60, ticks:0.80,
    yLabels:0.90, xLabels:1.00, yTitle:1.30, xTitle:1.55,
    curve:1.70, curveDur:2.8,
    hatch:4.40, energy:4.90,
    maxLine:5.30, maxLbl:5.45,
    meanLine:5.80, meanLbl:5.95,
    minLine:6.30, minLbl:6.45
  };

  /* Puntos de la curva (hora, MW), tomados de la propia figura */
  const V = [[0,6.2],[1,5.3],[2,4],[3,4],[4,4.5],[5,4],[6,5],[7,6],[8,6.5],[8.2,8],[10,8],[12,10],[13,10],
             [14,9.5],[15,9.5],[16,9],[17,8],[19,9],[20,10],[20.5,11],[21.5,10.5],[23,6],[24,6]];
  const X = h => 125 + 17.7 * h;
  const Y = m => 340 - 22.25 * m;
  const P = V.map(([h, m]) => [X(h), Y(m)]);
  const yAt = x => {
    for(let i = 0; i < P.length - 1; i++){
      if(x <= P[i+1][0]){
        const [x0, y0] = P[i], [x1, y1] = P[i+1];
        return y0 + (y1 - y0) * ((x - x0) / ((x1 - x0) || 1));
      }
    }
    return P[P.length - 1][1];
  };

  let cr, tr, dot, ring, guide, foot, raf = 0, played = false;

  try{
    const main = svg.querySelector(':scope > g > g > g');
    const K = [...main.children];

    const put = (el, cls, t) => { el.classList.add(cls); el.style.setProperty('--d', t.toFixed(3) + 's'); };
    const glyphs = (g, cls, t0, step) => [...g.querySelectorAll('path')].forEach((p, i) => put(p, cls, t0 + i * step));

    /* Marco, caja del gráfico, ejes y marcas */
    put(K[1], 'f', T.frame);
    put(K[6], 'f', T.plotBox);
    put(K[7], 'f', T.axes);
    put(K[8], 'f', T.ticks);
    put(K[9], 'f', T.ticks);

    /* Título y rótulos de ejes */
    glyphs(K[2], 'u', T.title, 0.05);
    glyphs(K[3], 'u', T.yTitle, 0.04);
    glyphs(K[4], 'u', T.xTitle, 0.04);

    /* Números de los ejes: Y de abajo hacia arriba, X de izquierda a derecha */
    for(let j = 0; j < 7; j++)  glyphs(K[10 + j], 'u', T.yLabels + j * 0.09, 0.03);
    for(let j = 0; j < 13; j++) glyphs(K[17 + j], 'u', T.xLabels + j * 0.055, 0.03);

    /* Sombreado de energía consumida */
    [...K[5].querySelectorAll('g[clip-path] path')].forEach((p, i) => put(p, 'h', T.hatch + i * 0.1));
    glyphs(K[40], 'p', T.energy, 0.04);

    /* Líneas y etiquetas de demanda */
    const refs = [
      {ref:'max',  line:30, lbl:[34, 35], tl:T.maxLine,  tt:T.maxLbl},
      {ref:'mean', line:31, lbl:[36, 37], tl:T.meanLine, tt:T.meanLbl},
      {ref:'min',  line:32, lbl:[38, 39], tl:T.minLine,  tt:T.minLbl}
    ];
    refs.forEach(r => {
      const g = K[r.line], bar = g.querySelector('rect');
      put(bar, 'w', r.tl);
      bar.classList.add('refbar');
      g.style.setProperty('--c', bar.style.fill);
      g.classList.add('refg');
      g.setAttribute('data-ref', r.ref);
      const hit = document.createElementNS(NS, 'rect');   /* zona de contacto más ancha */
      hit.setAttribute('x', bar.getAttribute('x'));
      hit.setAttribute('y', (parseFloat(bar.getAttribute('y')) - 5).toFixed(2));
      hit.setAttribute('width', bar.getAttribute('width'));
      hit.setAttribute('height', 11.25);
      hit.setAttribute('fill', 'transparent');
      g.appendChild(hit);
      r.lbl.forEach((idx, n) => {
        const lg = K[idx];
        glyphs(lg, 'l', r.tt + n * 0.28, 0.04);
        lg.classList.add('lbl');
        lg.style.setProperty('--c', lg.style.fill);
        lg.setAttribute('data-ref', r.ref);
      });
    });
    K[40].classList.add('lbl');
    K[40].style.setProperty('--c', K[40].style.fill);
    K[40].setAttribute('data-ref', 'energy');
    K[5].setAttribute('data-ref', 'energy');

    /* Zonas de contacto para las etiquetas de texto */
    [34, 35, 36, 37, 38, 39, 40].forEach(i => {
      const g = K[i], bb = g.getBBox();
      const hit = document.createElementNS(NS, 'rect');
      hit.setAttribute('x', bb.x); hit.setAttribute('y', bb.y);
      hit.setAttribute('width', bb.width); hit.setAttribute('height', bb.height);
      hit.setAttribute('fill', 'transparent');
      g.appendChild(hit);
    });

    /* Curva: se descubre de izquierda a derecha con un recorte */
    const curve = K[33];
    const cp = document.createElementNS(NS, 'clipPath');
    cp.id = 'curveClip';
    cr = document.createElementNS(NS, 'rect');
    cr.setAttribute('x', 120); cr.setAttribute('y', 60); cr.setAttribute('width', 0); cr.setAttribute('height', 290);
    cp.appendChild(cr);
    curve.appendChild(cp);
    curve.querySelector('path').setAttribute('clip-path', 'url(#curveClip)');

    /* Punto que recorre la curva (mismo sistema de coordenadas que el gráfico) */
    tr = document.createElementNS(NS, 'g');
    tr.setAttribute('transform', 'matrix(0.314436,0,0,0.0980206,-390,0)');
    tr.setAttribute('class', 'tracer');
    tr.innerHTML = '<line class="guide"/><circle class="foot" r="1.7"/><circle class="ring" r="5"/><circle class="dot" r="3.5"/>';
    curve.after(tr);
    guide = tr.querySelector('.guide'); foot = tr.querySelector('.foot');
    ring = tr.querySelector('.ring');   dot = tr.querySelector('.dot');

    /* Resaltado al pasar el cursor o tocar */
    const els = [...svg.querySelectorAll('[data-ref]')];
    const hl = ref => els.forEach(e => {
      e.classList.toggle('dim',  !!ref && e.getAttribute('data-ref') !== ref);
      e.classList.toggle('emph', !!ref && e.getAttribute('data-ref') === ref);
    });
    let sticky = null;
    els.forEach(e => {
      const ref = e.getAttribute('data-ref');
      e.addEventListener('pointerenter', ev => { if(ev.pointerType === 'mouse') hl(ref); });
      e.addEventListener('pointerleave', ev => { if(ev.pointerType === 'mouse') hl(sticky); });
      e.addEventListener('click', ev => { ev.stopPropagation(); sticky = (sticky === ref) ? null : ref; hl(sticky); });
    });
    stage.addEventListener('click', () => { sticky = null; hl(null); });

    stage.dataset.state = 'ready';
  }catch(err){
    stage.dataset.state = 'static';   /* si algo falla, la figura se muestra sin animar */
    console.error(err);
    return;
  }

  function setCurve(x){
    const y = yAt(x);
    cr.setAttribute('width', (x - 120 + 1.6).toFixed(2));
    dot.setAttribute('cx', x.toFixed(2)); dot.setAttribute('cy', y.toFixed(2));
    ring.setAttribute('cx', x.toFixed(2)); ring.setAttribute('cy', y.toFixed(2));
    foot.setAttribute('cx', x.toFixed(2)); foot.setAttribute('cy', 340);
    guide.setAttribute('x1', x.toFixed(2)); guide.setAttribute('x2', x.toFixed(2));
    guide.setAttribute('y1', (y + 4).toFixed(2)); guide.setAttribute('y2', 340);
  }
  const finishCurve = () => { cr.setAttribute('width', 440); tr.style.opacity = 0; };

  function run(){
    cancelAnimationFrame(raf);
    const x0 = P[0][0], x1 = P[P.length - 1][0];
    const ease = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const t0 = performance.now();
    const frame = now => {
      const t = (now - t0) / 1000 - T.curve;
      if(t < 0){ raf = requestAnimationFrame(frame); return; }
      const p = Math.min(1, t / T.curveDur);
      setCurve(x0 + (x1 - x0) * ease(p));
      tr.style.opacity = p < 1 ? 1 : 0;
      if(p < 1) raf = requestAnimationFrame(frame); else finishCurve();
    };
    raf = requestAnimationFrame(frame);
  }

  function play(){
    played = true;
    cancelAnimationFrame(raf);
    stage.classList.remove('play');
    cr.setAttribute('width', 0);
    tr.style.opacity = 0;
    void stage.offsetWidth;
    stage.classList.add('play');
    if(reduce) finishCurve(); else run();
  }

  document.getElementById('replay').addEventListener('click', play);

  /* La animación inicia cuando la figura entra en pantalla */
  if('IntersectionObserver' in window){
    const io = new IntersectionObserver(en => {
      if(en.some(e => e.isIntersecting)){ io.disconnect(); if(!played) play(); }
    }, { threshold: 0.3 });
    io.observe(stage);
  }
  setTimeout(() => { if(!played) play(); }, 2500);
})();
</script>
</body>
