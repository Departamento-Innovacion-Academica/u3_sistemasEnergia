<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interacción del módulo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#44113C;
    --primary-soft:#f4eef3;
    --primary-mid:#8a6a85;
    --ink:#2a0a26;
    --text:#3d2f3b;
    --muted:#867a84;
    --border:#e9e2e8;
    --bg:#ffffff;
    --radius:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:clamp(18px,4vw,48px) clamp(16px,3.5vw,40px) 64px}

  /* Barra superior: progreso + instrucción */
  .bar{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    margin-bottom:clamp(22px,3.5vw,38px);
  }
  .progress{flex:1;max-width:340px;animation:fadeDown .7s .15s cubic-bezier(.2,.8,.2,1) both}
  .progress .label{display:flex;justify-content:space-between;font-size:.85rem;font-weight:500;color:var(--muted);margin-bottom:8px}
  .progress .label b{color:var(--primary);font-weight:600}
  .track{height:8px;border-radius:999px;background:var(--primary-soft);overflow:hidden}
  .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--primary),#9a3d8c);transition:width .6s cubic-bezier(.2,.8,.2,1)}

  .hint{
    margin-left:auto;display:inline-flex;align-items:center;gap:12px;
    background:var(--primary-soft);color:var(--primary);
    border:1.5px solid #e6d8e3;border-radius:999px;padding:10px 20px 10px 14px;
    font-size:.9rem;font-weight:500;line-height:1.35;text-align:left;
    animation:fadeDown .7s cubic-bezier(.2,.8,.2,1) both;
    transition:opacity .5s,transform .5s;
  }
  .hint .ic{
    flex:none;width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;
    display:grid;place-items:center;position:relative;
  }
  .hint .ic::after{
    content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--primary);
    animation:pulse 2s ease-out infinite;
  }
  .hint.done{opacity:.55}
  .hint.done .ic::after{animation:none;opacity:0}

  /* Columnas */
  .layout{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
  .col{display:flex;flex-direction:column;gap:22px}

  /* Tarjeta */
  .card{
    background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);
    overflow:hidden;position:relative;
    opacity:0;transform:translateY(34px) scale(.97);
    animation:rise .75s cubic-bezier(.2,.8,.2,1) forwards;
    transition:border-color .35s,box-shadow .35s,transform .35s;
  }
  .card:hover{border-color:#d9c7d5;box-shadow:0 18px 40px rgba(68,17,60,.11);transform:translateY(-3px)}
  .card.open{border-color:var(--primary);box-shadow:0 20px 44px rgba(68,17,60,.15)}
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--primary);
    transform:scaleY(0);transform-origin:top;transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .card.open::before{transform:scaleY(1)}

  .head{
    width:100%;display:flex;align-items:center;gap:18px;text-align:left;
    background:none;border:0;cursor:pointer;font-family:inherit;color:inherit;
    padding:24px 26px;
  }
  .head:focus-visible{outline:3px solid rgba(68,17,60,.35);outline-offset:-3px;border-radius:var(--radius)}
  .icon{
    position:relative;flex:none;width:58px;height:58px;border-radius:18px;
    background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;
    transition:background .35s,color .35s,transform .35s;
  }
  .card:hover .icon{transform:rotate(-6deg) scale(1.05)}
  .card.open .icon{background:var(--primary);color:#fff}
  .seen{
    position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;
    background:#2e8b57;color:#fff;display:grid;place-items:center;border:2px solid #fff;
    transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1);
  }
  .card.visited .seen{transform:scale(1)}
  .ttl{flex:1;min-width:0}
  .num{display:block;font-size:.72rem;font-weight:600;letter-spacing:.12em;color:var(--primary-mid);text-transform:uppercase}
  .ttl h3{font-size:clamp(1.15rem,2.2vw,1.4rem);font-weight:700;color:var(--ink);line-height:1.3;letter-spacing:-.01em}
  .plus{
    flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    background:var(--primary-soft);color:var(--primary);transition:transform .45s,background .3s,color .3s;
  }
  .card.open .plus{transform:rotate(135deg);background:var(--primary);color:#fff}

  .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}
  .card.open .body{grid-template-rows:1fr}
  .body > div{overflow:hidden}
  .body p{
    padding:0 28px 28px 28px;font-size:1.02rem;line-height:1.85;color:var(--text);
    opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s;
  }
  .card.open .body p{opacity:1;transform:none;transition-delay:.18s}

  /* Mensaje final */
  .done{
    display:none;margin-top:30px;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    background:var(--primary);color:#fff;border-radius:var(--radius);padding:22px 28px;
  }
  .done.show{display:flex;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  .done strong{font-weight:600;font-size:1.05rem}
  .done span{display:block;font-size:.9rem;opacity:.85;font-weight:400}
  .reset{
    border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer;
    font:500 .92rem 'Poppins',sans-serif;padding:11px 22px;border-radius:999px;transition:.25s;
  }
  .reset:hover{background:#fff;color:var(--primary)}

  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}

  /* Adaptabilidad */
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;gap:20px}
    .col{display:contents}
    .layout{display:flex;flex-direction:column}
  }
  @media (max-width:620px){
    .bar{flex-direction:column-reverse;align-items:stretch;gap:16px}
    .hint{align-self:flex-end;margin-left:0;font-size:.85rem}
    .progress{max-width:none}
    .head{padding:20px 18px;gap:14px}
    .icon{width:50px;height:50px;border-radius:15px}
    .plus{width:34px;height:34px}
    .body p{padding:0 20px 22px;font-size:.98rem}
    .done{padding:20px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="progress" aria-live="polite">
      <div class="label"><span>Explorados</span><b id="count">0 de 4</b></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <div class="hint" id="hint">
      <span class="ic">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="m5.1 8-2.9-.8"/><path d="M14 4.1 12 6"/><path d="m6 12-1.9 2"/></svg>
      </span>
      <span>Haga clic en cada tarjeta<br>para descubrir su contenido</span>
    </div>
  </div>

  <div class="layout" id="layout"></div>

  <div class="done" id="done" role="status">
    <div><strong>¡Excelente! Exploraste todos los apartados.</strong><span>Puedes volver a revisarlos cuando quieras.</span></div>
    <button class="reset" id="reset" type="button">Reiniciar</button>
  </div>
</div>

<script>
/* Para agregar o cambiar apartados, edita solo este arreglo:
   las tarjetas se reparten solas en dos columnas. */
const ICONS = {
  libro:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  sello:'<path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/>',
  diana:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  birrete:'<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>'
};
const DATA = [
  {t:"Conocimientos previos", i:"libro", d:"Formación básica en las áreas de ingeniería, preferiblemente con fundamentación en el uso de herramientas computacionales de ingeniería, modelamiento y simulación."},
  {t:"Competencias", i:"sello", d:"El módulo contribuye al desarrollo de competencias para analizar y modelar los sistemas energéticos, así como interpretar la reglamentación vigente aplicable a cada caso específico."},
  {t:"Objetivos", i:"diana", d:"Conocer, comprender y aplicar los modelos que representan un sistema de energía."},
  {t:"Resultados de aprendizaje", i:"birrete", d:"Aplica los principios básicos de la energía para el entendimiento de los procesos requeridos para su aprovechamiento."}
];

const $ = s => document.querySelector(s);
const layout = $('#layout'), countEl = $('#count'), fill = $('#fill'), done = $('#done'), hint = $('#hint');
const svg = (k, s=26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function build(){
  const half = Math.ceil(DATA.length / 2);
  const cols = [DATA.slice(0, half), DATA.slice(half)];
  let n = 0;
  layout.innerHTML = cols.map(col => `<div class="col">${col.map(x => {
    const i = n++;
    return `
    <article class="card" style="animation-delay:${.2 + i*.12}s">
      <button class="head" type="button" aria-expanded="false" aria-controls="b${i}">
        <span class="icon">${svg(x.i)}<span class="seen"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span></span>
        <span class="ttl"><span class="num">${String(i+1).padStart(2,'0')}</span><h3>${esc(x.t)}</h3></span>
        <span class="plus"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>
      <div class="body" id="b${i}"><div><p>${esc(x.d)}</p></div></div>
    </article>`;
  }).join('')}</div>`).join('');
  update();
}

function update(){
  const seen = layout.querySelectorAll('.card.visited').length;
  countEl.textContent = `${seen} de ${DATA.length}`;
  fill.style.width = (seen / DATA.length * 100) + '%';
  done.classList.toggle('show', seen === DATA.length);
  hint.classList.toggle('done', seen > 0);
}

layout.addEventListener('click', e => {
  const h = e.target.closest('.head'); if(!h) return;
  const card = h.parentElement;
  const open = !card.classList.contains('open');
  card.classList.toggle('open', open);
  h.setAttribute('aria-expanded', open);
  if(open) card.classList.add('visited');
  update();
});

$('#reset').addEventListener('click', () => {
  layout.querySelectorAll('.card').forEach(c => {
    c.classList.remove('open','visited');
    c.querySelector('.head').setAttribute('aria-expanded','false');
  });
  update();
  scrollTo({top:0, behavior:'smooth'});
});

build();
</script>
</body>
</html>
