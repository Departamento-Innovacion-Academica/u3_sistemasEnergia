<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjetas interactivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#44113C;
    --primary-soft:#f4eef3;
    --primary-mid:#8a6a85;
    --ink:#2a0a26;
    --text:#3d2f3b;
    --muted:#867a84;
    --line:#d9c9d6;
    --bg:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:clamp(18px,4vw,48px) clamp(16px,3.5vw,40px) 64px}

  /* Barra superior: avance + instrucción */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .progress{flex:1;max-width:340px;animation:fadeDown .7s .15s cubic-bezier(.2,.8,.2,1) both}
  .progress .label{display:flex;justify-content:space-between;font-size:.85rem;font-weight:500;color:var(--muted);margin-bottom:8px}
  .progress .label b{color:var(--primary);font-weight:600}
  .track{height:8px;border-radius:999px;background:var(--primary-soft);overflow:hidden}
  .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--primary),#9a3d8c);transition:width .6s cubic-bezier(.2,.8,.2,1)}

  .hint{
    margin-left:auto;display:inline-flex;align-items:center;gap:12px;
    background:var(--primary-soft);color:var(--primary);
    border:1.5px solid #e6d8e3;border-radius:999px;padding:10px 22px 10px 14px;
    font-size:.9rem;font-weight:500;line-height:1.35;text-align:left;
    animation:fadeDown .7s cubic-bezier(.2,.8,.2,1) both;
    transition:opacity .5s;
  }
  .hint .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;position:relative}
  .hint .ic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--primary);animation:pulse 2s ease-out infinite}
  .hint.used{opacity:.55}
  .hint.used .ic::after{animation:none;opacity:0}

  /* Rejilla */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:56px 28px;padding-top:clamp(52px,7vw,72px);
  }
  .slot{display:flex;opacity:0;transform:translateY(36px);animation:rise .8s cubic-bezier(.2,.8,.2,1) forwards}
  .card{
    flex:1;display:grid;perspective:1500px;cursor:pointer;border-radius:24px;
    transition:transform .35s;-webkit-tap-highlight-color:transparent;
  }
  .card:hover{transform:translateY(-6px)}
  .card:focus-visible{outline:3px solid rgba(68,17,60,.4);outline-offset:6px}
  .inner{
    display:grid;transform-style:preserve-3d;
    transition:transform .85s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped .inner{transform:rotateY(180deg)}

  .face{
    grid-area:1/1;position:relative;background:#fff;
    border:2.5px solid var(--line);border-radius:24px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    min-height:310px;box-shadow:0 10px 28px rgba(68,17,60,.06);
    transition:box-shadow .35s;
  }
  .card:hover .face{box-shadow:0 22px 44px rgba(68,17,60,.14)}
  .face::before{
    content:"";position:absolute;left:-2.5px;right:-2.5px;top:-2.5px;height:15px;
    background:var(--primary);border-radius:24px 24px 0 0;
    transform-origin:center;animation:bar .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:inherit;
  }
  .back{transform:rotateY(180deg)}

  .num{
    position:absolute;left:50%;top:-27px;width:68px;height:68px;border-radius:50%;
    background:var(--primary);color:#fff;font-weight:700;font-size:1.6rem;
    display:grid;place-items:center;transform:translateX(-50%);
    box-shadow:0 8px 18px rgba(68,17,60,.3);z-index:2;
    animation:pop .7s cubic-bezier(.3,1.6,.5,1) both;
  }
  .ok{
    position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;
    background:#2e8b57;color:#fff;border:2.5px solid #fff;display:grid;place-items:center;
    transform:scale(0);transition:transform .45s cubic-bezier(.3,1.6,.5,1);
  }
  .card.visited .ok{transform:scale(1)}

  /* Frente */
  .front{
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    gap:18px;padding:70px 24px 34px;
  }
  .fi{
    width:66px;height:66px;border-radius:20px;background:var(--primary-soft);color:var(--primary);
    display:grid;place-items:center;transition:transform .4s,background .35s,color .35s;
  }
  .card:hover .fi{background:var(--primary);color:#fff;transform:rotate(-6deg) scale(1.06)}
  .front h3{font-size:clamp(1.2rem,2.2vw,1.45rem);font-weight:700;color:var(--ink);line-height:1.3;letter-spacing:-.01em}
  .cue{
    display:inline-flex;align-items:center;gap:8px;background:var(--primary-soft);color:var(--primary-mid);
    font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:8px 16px;border-radius:999px;
  }

  /* Reverso */
  .back{padding:56px 28px 32px}
  .back h3{font-size:clamp(1.15rem,2vw,1.35rem);font-weight:700;color:var(--ink);text-align:center;line-height:1.3;margin-bottom:16px}
  .back ul{list-style:none;display:grid;gap:14px}
  .back li{position:relative;padding-left:24px;font-size:1rem;line-height:1.65;color:var(--text)}
  .back li::before{content:"";position:absolute;left:4px;top:.65em;width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .back li b{font-weight:700;color:var(--ink)}
  .back p{font-size:1rem;line-height:1.75;text-align:center;color:var(--text)}
  .turn{
    position:absolute;right:16px;bottom:14px;width:34px;height:34px;border-radius:50%;
    background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;transition:.3s;
  }
  .card:hover .turn{background:var(--primary);color:#fff;transform:rotate(-180deg)}
  .back{padding-bottom:56px}

  /* Mensaje final */
  .done{
    display:none;margin-top:44px;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
    background:var(--primary);color:#fff;border-radius:24px;padding:22px 28px;
  }
  .done.show{display:flex;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  .done strong{font-weight:600;font-size:1.05rem}
  .done span{display:block;font-size:.9rem;opacity:.85}
  .reset{
    border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer;
    font:500 .92rem 'Poppins',sans-serif;padding:11px 22px;border-radius:999px;transition:.25s;
  }
  .reset:hover{background:#fff;color:var(--primary)}

  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
  @keyframes pop{from{transform:translateX(-50%) scale(0)}to{transform:translateX(-50%) scale(1)}}
  @keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  @media (max-width:620px){
    .bar{flex-direction:column-reverse;align-items:stretch;gap:16px}
    .hint{align-self:flex-end;margin-left:0;font-size:.85rem}
    .progress{max-width:none}
    .grid{gap:52px;padding-top:54px}
    .back{padding:54px 22px 54px}
    .done{padding:20px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="progress" aria-live="polite">
      <div class="label"><span>Tarjetas revisadas</span><b id="count"></b></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <div class="hint" id="hint">
      <span class="ic">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="m5.1 8-2.9-.8"/><path d="M14 4.1 12 6"/><path d="m6 12-1.9 2"/></svg>
      </span>
      <span>Haga clic en cada tarjeta<br>para voltearla y conocer su contenido</span>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="done" id="done" role="status">
    <div><strong>¡Excelente! Se revisaron todas las tarjetas.</strong><span>Es posible volver a consultarlas cuando sea necesario.</span></div>
    <button class="reset" id="reset" type="button">Reiniciar</button>
  </div>
</div>

<script>
/* Para agregar o cambiar tarjetas, se edita solo este arreglo.
   Cada tarjeta puede tener una lista (items) o un texto corrido (text). */
const ICONS = {
  rayo:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  reloj:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  usuarios:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  girar:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'
};
const DATA = [
  {t:"Por su naturaleza eléctrica", i:"rayo", items:[
    {b:"Resistivas:", d:"convierten la energía eléctrica en calor (por ejemplo, calefactores o resistencias)."},
    {b:"Inductivas:", d:"consumen potencia reactiva y generan desfase entre corriente y tensión (motores, bombas, ventiladores)."},
    {b:"Capacitivas:", d:"suministran potencia reactiva, como los bancos de condensadores o filtros activos."}
  ]},
  {t:"Por su comportamiento temporal", i:"reloj", items:[
    {b:"Constantes:", d:"presentan demanda estable (iluminación LED, motores síncronos)."},
    {b:"Variables:", d:"fluctúan según la operación del usuario (equipos industriales, cargas domésticas)."}
  ]},
  {t:"Por el tipo de usuario", i:"usuarios", text:"Residencial, comercial, industrial y agrícola, cada uno con patrones de demanda característicos."}
];

const $ = s => document.querySelector(s);
const grid = $('#grid'), countEl = $('#count'), fill = $('#fill'), done = $('#done'), hint = $('#hint');
const svg = (k, s=30) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const check = '<span class="ok"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span>';

function build(){
  grid.innerHTML = DATA.map((x,i) => {
    const delay = `${.2 + i*.14}s`;
    const body = x.items
      ? `<ul>${x.items.map(li => `<li><b>${esc(li.b)}</b> ${esc(li.d)}</li>`).join('')}</ul>`
      : `<p>${esc(x.text)}</p>`;
    return `
    <div class="slot" style="animation-delay:${delay}">
      <div class="card" role="button" tabindex="0" aria-pressed="false" aria-label="${esc(x.t)}. Voltear tarjeta">
        <div class="inner">
          <div class="face front" style="animation-delay:${delay}" aria-hidden="false">
            <span class="num" style="animation-delay:${delay}">${i+1}${check}</span>
            <div class="fi">${svg(x.i)}</div>
            <h3>${esc(x.t)}</h3>
            <span class="cue">${svg('girar',14)} Voltear</span>
          </div>
          <div class="face back" style="animation-delay:${delay}" aria-hidden="true">
            <span class="num" style="animation-delay:${delay}">${i+1}${check}</span>
            <h3>${esc(x.t)}</h3>
            ${body}
            <span class="turn">${svg('girar',16)}</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
  update();
}

function update(){
  const seen = grid.querySelectorAll('.card.visited').length;
  countEl.textContent = `${seen} de ${DATA.length}`;
  fill.style.width = (seen / DATA.length * 100) + '%';
  done.classList.toggle('show', seen === DATA.length);
  hint.classList.toggle('used', seen > 0);
}

function flip(card){
  const on = !card.classList.contains('flipped');
  card.classList.toggle('flipped', on);
  card.setAttribute('aria-pressed', on);
  card.querySelector('.front').setAttribute('aria-hidden', on);
  card.querySelector('.back').setAttribute('aria-hidden', !on);
  if(on) card.classList.add('visited');
  update();
}

grid.addEventListener('click', e => {
  const c = e.target.closest('.card'); if(c) flip(c);
});
grid.addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){
    const c = e.target.closest('.card');
    if(c){ e.preventDefault(); flip(c); }
  }
});

$('#reset').addEventListener('click', () => {
  grid.querySelectorAll('.card').forEach(c => {
    c.classList.remove('flipped','visited');
    c.setAttribute('aria-pressed','false');
    c.querySelector('.front').setAttribute('aria-hidden','false');
    c.querySelector('.back').setAttribute('aria-hidden','true');
  });
  update();
  scrollTo({top:0, behavior:'smooth'});
});

build();
</script>
</body>
</html>
