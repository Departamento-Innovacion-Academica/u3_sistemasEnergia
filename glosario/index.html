<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glosario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#44113C;
    --primary-soft:#f4eef3;
    --primary-mid:#8a6a85;
    --text:#4a4048;
    --muted:#867a84;
    --border:#e9e2e8;
    --bg:#ffffff;
    --radius:28px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:clamp(18px,4vw,48px) clamp(16px,3.5vw,40px) 72px}

  /* Búsqueda */
  .searchrow{
    display:flex;align-items:center;gap:20px;
    animation:fadeDown .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .search{
    flex:1;display:flex;align-items:center;gap:14px;min-width:0;
    border:1.5px solid var(--border);border-radius:999px;background:#fff;
    padding:0 26px;height:64px;transition:border-color .25s,box-shadow .25s;
  }
  .search:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(68,17,60,.08)}
  .search svg{flex:none;color:var(--muted)}
  .search input{
    flex:1;min-width:0;border:0;outline:0;background:transparent;
    font:400 1.05rem 'Poppins',sans-serif;color:var(--primary);
  }
  .search input::placeholder{color:var(--muted)}
  .total{flex:none;font-size:.95rem;color:var(--muted);font-weight:400;white-space:nowrap}

  /* Filtros */
  .chips{display:flex;flex-wrap:wrap;gap:12px;margin:26px 0 30px;animation:fadeDown .7s .1s cubic-bezier(.2,.8,.2,1) both}
  .chip{
    border:1.5px solid var(--border);background:#fff;color:var(--text);
    font:500 1rem 'Poppins',sans-serif;padding:14px 26px;border-radius:999px;cursor:pointer;
    transition:.25s;
  }
  .chip:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-2px)}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 10px 22px rgba(68,17,60,.28)}

  /* Tarjetas */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:26px}
  .card{
    display:flex;flex-direction:column;
    background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);
    padding:32px 32px 26px;cursor:pointer;position:relative;
    opacity:0;transform:translateY(30px) scale(.97);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;
    transition:transform .35s,box-shadow .35s,border-color .35s;
  }
  .card:hover{transform:translateY(-6px);border-color:#d9c7d5;box-shadow:0 22px 46px rgba(68,17,60,.13)}
  .card:focus-visible{outline:3px solid rgba(68,17,60,.35);outline-offset:3px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
  .icon{
    width:60px;height:60px;border-radius:18px;background:var(--primary-soft);color:var(--primary);
    display:grid;place-items:center;transition:background .35s,color .35s,transform .35s;
  }
  .card:hover .icon{background:var(--primary);color:#fff;transform:rotate(-6deg) scale(1.05)}
  .badge{
    background:var(--primary-soft);color:var(--primary-mid);
    font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    padding:8px 16px;border-radius:12px;text-align:right;line-height:1.3;
  }
  .card h3{font-size:clamp(1.25rem,2.2vw,1.5rem);font-weight:700;line-height:1.3;color:var(--primary);margin-bottom:14px;letter-spacing:-.01em}
  .card p{
    font-size:1rem;line-height:1.75;color:var(--text);
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
    margin-bottom:26px;
  }
  .foot{
    margin-top:auto;padding-top:22px;border-top:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .src{font-size:.88rem;color:var(--muted)}
  .more{
    border:0;background:none;cursor:pointer;color:var(--primary);
    font:600 1rem 'Poppins',sans-serif;display:inline-flex;align-items:center;gap:8px;flex:none;
  }
  .more svg{transition:transform .3s}
  .card:hover .more svg{transform:translateX(5px)}

  mark{background:#f2d3ec;color:var(--primary);border-radius:4px;padding:0 2px}

  .empty{display:none;text-align:center;padding:64px 20px;color:var(--muted);border:1.5px dashed var(--border);border-radius:var(--radius)}
  .empty.show{display:block;animation:rise .5s both}

  /* Modal */
  .overlay{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
    background:rgba(34,8,30,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .modal{
    width:min(640px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:32px;
    padding:clamp(26px,5vw,44px);position:relative;
    transform:translateY(30px) scale(.96);transition:transform .4s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 40px 90px rgba(34,8,30,.35);
  }
  .overlay.open .modal{transform:none}
  .modal .top{margin-bottom:22px}
  .modal h3{font-size:clamp(1.5rem,4vw,2rem);font-weight:700;color:var(--primary);line-height:1.25;margin-bottom:16px}
  .modal p{font-size:1.05rem;line-height:1.85;color:var(--text);margin-bottom:26px}
  .modal .ref{
    display:inline-block;background:var(--primary-soft);color:var(--primary);
    font-size:.9rem;font-weight:500;padding:10px 18px;border-radius:14px;
  }
  .close{
    position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
    background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;transition:.25s;
  }
  .close:hover{background:var(--primary);color:#fff;transform:rotate(90deg)}
  .modal .top{padding-right:52px}

  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}

  @media (max-width:700px){
    .searchrow{flex-direction:column;align-items:stretch;gap:10px}
    .search{height:58px;padding:0 20px}
    .total{text-align:right;font-size:.88rem}
    .chips{gap:10px;margin:20px 0 24px}
    .chip{padding:11px 20px;font-size:.92rem}
    .grid{grid-template-columns:1fr;gap:20px}
    .card{padding:26px 24px 22px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="searchrow">
    <label class="search">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar un término o concepto…" autocomplete="off" aria-label="Buscar en el glosario">
    </label>
    <span class="total" id="total"></span>
  </div>

  <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No encontramos conceptos que coincidan con tu búsqueda.</div>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="close" type="button" aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="top"><div class="icon" id="mIcon"></div><span class="badge" id="mBadge"></span></div>
    <h3 id="mTitle"></h3>
    <p id="mDesc"></p>
    <span class="ref" id="mRef"></span>
  </div>
</div>

<script>
const ICONS = {
  down:'<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/>',
  battery:'<path d="M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2"/><path d="M6 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"/><path d="m11 7-3 5h4l-3 5"/><line x1="22" x2="22" y1="11" y2="13"/>',
  plug:'<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',
  shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  activity:'<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>',
  wave:'<path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/>',
  gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  layers:'<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  bars:'<line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/>',
  flame:'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  sliders:'<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>'
};
const svg = (k, s=26) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

const DATA = [
  {t:"Caída de tensión", c:"Red y tensión", i:"down", d:"Disminución de la tensión entre los extremos de una línea eléctrica, causada por la impedancia del conductor.", s:"Wood & Wollenberg, 2012; Gonen, 2014"},
  {t:"Capacidad instalada", c:"Demanda y carga", i:"battery", d:"Potencia total disponible de un sistema de generación, calculada como la suma de las potencias nominales de todos los generadores.", s:"Twidell & Weir, 2015"},
  {t:"Carga instalada", c:"Demanda y carga", i:"plug", d:"Suma de las potencias nominales de todos los equipos eléctricos conectados a una instalación. Representa la demanda máxima teórica.", s:"Gonen, 2014"},
  {t:"Coordinación de protecciones", c:"Protección y calidad", i:"shield", d:"Estrategia que asegura que el dispositivo de protección más cercano a una falla actúe primero, minimizando la interrupción del servicio.", s:"IEEE, 2001"},
  {t:"Curva de carga", c:"Demanda y carga", i:"activity", d:"Representación gráfica de la variación de la demanda de potencia eléctrica a lo largo de un periodo de tiempo específico.", s:"Wood & Wollenberg, 2012"},
  {t:"Distorsión armónica total (THD)", c:"Protección y calidad", i:"wave", d:"Métrica que cuantifica la distorsión en una forma de onda, calculada como la raíz de la suma de cuadrados de los armónicos sobre el valor fundamental.", s:"IEEE, 2014"},
  {t:"Eficiencia del transformador", c:"Eficiencia", i:"gauge", d:"Relación entre la potencia de salida y la potencia de entrada, afectada por las pérdidas en el núcleo y en los devanados.", s:"Gonen, 2014"},
  {t:"Eficiencia global del sistema", c:"Eficiencia", i:"layers", d:"Eficiencia total de un sistema eléctrico, obtenida como el producto de las eficiencias individuales de sus etapas principales.", s:"Twidell & Weir, 2015"},
  {t:"Factor de carga", c:"Demanda y carga", i:"bars", d:"Indicador de la uniformidad del consumo, calculado como la relación entre la potencia media y la potencia máxima en un periodo.", s:"Gonen, 2014"},
  {t:"Pérdidas por efecto Joule", c:"Red y tensión", i:"flame", d:"Potencia disipada en forma de calor en los conductores, proporcional al cuadrado de la corriente y a su resistencia.", s:"IEEE, 1994"},
  {t:"Regulación de tensión", c:"Red y tensión", i:"sliders", d:"Medida del cambio porcentual de tensión en un punto de la red entre condiciones de carga y sin carga.", s:"Gonen, 2014"}
];

const $ = s => document.querySelector(s);
const grid = $('#grid'), q = $('#q'), total = $('#total'), empty = $('#empty'), chipsEl = $('#chips');
const overlay = $('#overlay');
let cat = 'Todos', lastFocus = null;

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function hl(text, term){
  if(!term) return esc(text);
  const nt = norm(text), n = norm(term);
  let out = '', i = 0, idx;
  while((idx = nt.indexOf(n, i)) !== -1){
    out += esc(text.slice(i, idx)) + '<mark>' + esc(text.slice(idx, idx + n.length)) + '</mark>';
    i = idx + n.length;
  }
  return out + esc(text.slice(i));
}

const cats = ['Todos', ...new Set(DATA.map(x => x.c))];
chipsEl.innerHTML = cats.map(c => `<button class="chip${c==='Todos'?' active':''}" data-c="${c}" type="button">${c}</button>`).join('');
chipsEl.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  cat = b.dataset.c;
  chipsEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === b));
  render();
});

function render(){
  const term = q.value.trim(), nq = norm(term);
  const rows = DATA.map((x,i) => ({...x, n:i})).filter(x =>
    (cat === 'Todos' || x.c === cat) &&
    (!nq || norm(x.t).includes(nq) || norm(x.d).includes(nq) || norm(x.s).includes(nq) || norm(x.c).includes(nq))
  );
  grid.innerHTML = rows.map((x,i) => `
    <article class="card" tabindex="0" data-n="${x.n}" style="animation-delay:${.15 + i*.06}s">
      <div class="top"><div class="icon">${svg(x.i)}</div><span class="badge">${esc(x.c)}</span></div>
      <h3>${hl(x.t, term)}</h3>
      <p>${hl(x.d, term)}</p>
      <div class="foot">
        <span class="src">${hl(x.s, term)}.</span>
        <button class="more" type="button" tabindex="-1">Explorar <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </article>`).join('');
  empty.classList.toggle('show', rows.length === 0);
  total.textContent = rows.length === 1 ? '1 concepto' : rows.length + ' conceptos';
}

function openModal(n){
  const x = DATA[n];
  $('#mIcon').innerHTML = svg(x.i, 28);
  $('#mBadge').textContent = x.c;
  $('#mTitle').textContent = x.t;
  $('#mDesc').textContent = x.d;
  $('#mRef').textContent = 'Fuente: ' + x.s;
  lastFocus = document.activeElement;
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
  $('#close').focus();
}
function closeModal(){
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  if(lastFocus) lastFocus.focus();
}

grid.addEventListener('click', e => {
  const c = e.target.closest('.card'); if(c) openModal(+c.dataset.n);
});
grid.addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){
    const c = e.target.closest('.card');
    if(c){ e.preventDefault(); openModal(+c.dataset.n); }
  }
});
$('#close').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
addEventListener('keydown', e => { if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });
q.addEventListener('input', render);

render();
</script>
</body>
</html>
