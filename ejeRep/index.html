<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicios de repaso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#44113C;
    --primary-soft:#f4eef3;
    --primary-mid:#8a6a85;
    --ink:#2a0a26;
    --text:#3d2f3b;
    --muted:#867a84;
    --line:#e3d6e0;
    --ok:#2e8b57;
    --ok-soft:#e8f5ee;
    --bad:#b3363f;
    --bad-soft:#fbecee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,sans-serif;background:#fff;color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:clamp(16px,4vw,44px) clamp(16px,3.5vw,36px) 64px}

  /* Barra superior: avance + instrucción */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:clamp(30px,5vw,48px)}
  .progress{flex:1;max-width:320px;animation:fadeDown .7s .15s cubic-bezier(.2,.8,.2,1) both}
  .progress .label{display:flex;justify-content:space-between;font-size:.85rem;font-weight:500;color:var(--muted);margin-bottom:8px}
  .progress .label b{color:var(--primary);font-weight:600}
  .track{height:8px;border-radius:999px;background:var(--primary-soft);overflow:hidden}
  .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--primary),#9a3d8c);transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .hint{
    margin-left:auto;display:inline-flex;align-items:center;gap:12px;
    background:var(--primary-soft);color:var(--primary);border:1.5px solid #e6d8e3;border-radius:999px;
    padding:10px 22px 10px 14px;font-size:.9rem;font-weight:500;line-height:1.35;text-align:left;
    animation:fadeDown .7s cubic-bezier(.2,.8,.2,1) both;transition:opacity .5s;
  }
  .hint .ic{flex:none;width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;position:relative}
  .hint .ic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--primary);animation:pulse 2s ease-out infinite}
  .hint.used{opacity:.55}
  .hint.used .ic::after{animation:none;opacity:0}

  /* Secciones */
  .sec{
    display:inline-block;margin:6px 0 40px;background:var(--primary);color:#fff;
    font-size:.82rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    padding:9px 20px;border-radius:999px;opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .sec.later{margin-top:22px}

  /* Tarjeta de pregunta */
  .q{
    position:relative;background:#fff;border:2.5px solid var(--line);border-radius:28px;
    padding:clamp(40px,5vw,48px) clamp(20px,4vw,36px) clamp(22px,3vw,30px);margin-bottom:46px;
    box-shadow:0 10px 28px rgba(68,17,60,.06);
    opacity:0;transform:translateY(34px) scale(.98);animation:rise .75s cubic-bezier(.2,.8,.2,1) forwards;
    transition:border-color .4s,box-shadow .4s;
  }
  .q::before{
    content:"";position:absolute;left:-2.5px;right:-2.5px;top:-2.5px;height:15px;background:var(--primary);
    border-radius:28px 28px 0 0;transition:background .4s;
  }
  .q.ok{border-color:#bfe0cd}
  .q.ok::before,.q.ok .num{background:var(--ok)}
  .q.bad{border-color:#efc5ca}
  .q.bad::before,.q.bad .num{background:var(--bad)}
  .num{
    position:absolute;left:50%;top:-27px;width:60px;height:60px;border-radius:50%;
    background:var(--primary);color:#fff;font-weight:700;font-size:1.45rem;display:grid;place-items:center;
    transform:translateX(-50%);box-shadow:0 8px 18px rgba(68,17,60,.28);transition:background .4s;
  }
  .q h2{font-size:clamp(1.02rem,2.3vw,1.2rem);font-weight:600;color:var(--ink);line-height:1.55;margin:6px 0 20px;text-align:left}

  /* Opciones */
  .opts{display:grid;gap:12px}
  .opts.vf{grid-template-columns:1fr 1fr}
  .opt{
    display:flex;align-items:center;gap:14px;text-align:left;width:100%;cursor:pointer;
    background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 18px;
    font:400 1rem/1.5 'Poppins',sans-serif;color:var(--text);
    transition:border-color .25s,background .25s,transform .25s,box-shadow .25s,opacity .3s;
  }
  .opts.vf .opt{justify-content:center;font-weight:600;font-size:1.05rem;padding:18px}
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft);transform:translateY(-2px);box-shadow:0 8px 18px rgba(68,17,60,.1)}
  .opt:focus-visible{outline:3px solid rgba(68,17,60,.4);outline-offset:2px}
  .opt:disabled{cursor:default}
  .let{
    flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:var(--primary-soft);color:var(--primary);font-weight:600;font-size:.9rem;transition:.3s;
  }
  .opt .mark{flex:none;margin-left:auto;width:26px;height:26px;border-radius:50%;display:none;place-items:center;color:#fff}
  .opts.vf .opt .mark{margin-left:0}
  .opt.right{border-color:var(--ok);background:var(--ok-soft);color:#1f5e3b}
  .opt.right .let{background:var(--ok);color:#fff}
  .opt.right .mark{display:grid;background:var(--ok);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#7d2229;animation:shake .45s}
  .opt.wrong .let{background:var(--bad);color:#fff}
  .opt.wrong .mark{display:grid;background:var(--bad);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
  .q.done .opt:not(.right):not(.wrong){opacity:.55}

  /* Realimentación */
  .fb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}
  .q.done .fb{grid-template-rows:1fr}
  .fb > div{overflow:hidden}
  .fbin{margin-top:18px;border-radius:20px;padding:18px 20px;background:var(--primary-soft);border-left:6px solid var(--primary)}
  .q.ok .fbin{background:var(--ok-soft);border-left-color:var(--ok)}
  .q.bad .fbin{background:var(--bad-soft);border-left-color:var(--bad)}
  .fbin strong{display:block;font-size:1rem;font-weight:700;margin-bottom:4px;color:var(--ink)}
  .q.ok .fbin strong{color:#1f5e3b}
  .q.bad .fbin strong{color:#7d2229}
  .fbin p{font-size:.97rem;line-height:1.75;color:var(--text)}

  /* Resultado final */
  .result{
    display:none;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
    background:var(--primary);color:#fff;border-radius:28px;padding:26px 30px;
  }
  .result.show{display:flex;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  .score{display:flex;align-items:center;gap:18px}
  .ring{
    flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;
    background:#fff;color:var(--primary);font-weight:700;font-size:1.35rem;
  }
  .result strong{display:block;font-weight:600;font-size:1.1rem}
  .result span.sub{display:block;font-size:.9rem;opacity:.85}
  .reset{
    border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer;
    font:500 .92rem 'Poppins',sans-serif;padding:11px 24px;border-radius:999px;transition:.25s;
  }
  .reset:hover{background:#fff;color:var(--primary)}

  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

  @media (max-width:620px){
    .bar{flex-direction:column-reverse;align-items:stretch;gap:16px}
    .hint{align-self:flex-end;margin-left:0;font-size:.85rem}
    .progress{max-width:none}
    .opts.vf{grid-template-columns:1fr}
    .opt{padding:13px 14px;gap:12px}
    .result{padding:22px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <div class="progress" aria-live="polite">
      <div class="label"><span>Preguntas respondidas</span><b id="count"></b></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <div class="hint" id="hint">
      <span class="ic">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 9 5 12 1.8-5.2L21 14Z"/><path d="M7.2 2.2 8 5.1"/><path d="m5.1 8-2.9-.8"/><path d="M14 4.1 12 6"/><path d="m6 12-1.9 2"/></svg>
      </span>
      <span>Seleccione una opción en cada pregunta<br>para conocer la realimentación</span>
    </div>
  </div>

  <div id="list"></div>

  <div class="result" id="result" role="status">
    <div class="score">
      <div class="ring" id="ring"></div>
      <div><strong id="rTitle"></strong><span class="sub" id="rSub"></span></div>
    </div>
    <button class="reset" id="reset" type="button">Reintentar</button>
  </div>
</div>

<script>
/* Para agregar o cambiar preguntas, se edita solo este arreglo.
   sec: encabezado de la sección | opts: opciones | a: índice de la respuesta correcta
   vf: true si es de Verdadero o Falso (opciones lado a lado, sin letras) */
const DATA = [
  { sec:"Seleccione Verdadero o Falso", vf:true,
    q:"La carga instalada representa la potencia máxima teórica que puede demandar una instalación si todos los equipos operan simultáneamente.",
    opts:["Verdadero","Falso"], a:0,
    fb:"La carga instalada se define como la suma de las potencias nominales de todos los dispositivos eléctricos conectados y representa el valor máximo teórico de demanda, aunque en la práctica raramente se alcanza (Gonen, 2014)." },
  { sec:"Seleccione Verdadero o Falso", vf:true,
    q:"Un valor alto del factor de carga indica que el consumo eléctrico se mantiene estable y presenta pocas variaciones a lo largo del tiempo.",
    opts:["Verdadero","Falso"], a:0,
    fb:"El factor de carga mide la uniformidad del consumo; valores cercanos a 1 reflejan un consumo constante y eficiente, mientras que valores bajos muestran picos pronunciados de demanda que afectan la estabilidad del sistema (Gonen, 2014)." },
  { sec:"Seleccione la respuesta correcta",
    q:"¿Cuál de las siguientes afirmaciones describe correctamente el concepto de capacidad instalada?",
    opts:["Es la potencia máxima que pueden consumir las cargas conectadas a una instalación.",
           "Corresponde a la potencia total disponible de los equipos de generación o suministro.",
           "Representa la energía efectiva generada durante un periodo determinado.",
           "Se refiere únicamente a la potencia nominal de los inversores."], a:1,
    fb:"La capacidad instalada indica la potencia total nominal de los generadores de un sistema, expresada en kW o MW, y permite analizar la relación entre generación y demanda en sistemas eléctricos (Twidell & Weir, 2015)." },
  { sec:"Seleccione la respuesta correcta",
    q:"¿Cuál de los siguientes factores combina el grado de estabilidad del consumo con el nivel de aprovechamiento de la capacidad instalada?",
    opts:["Factor de demanda.","Factor de utilización.","Factor de carga.","Factor de simultaneidad."], a:1,
    fb:"El factor de utilización resulta del producto entre el factor de carga y el factor de demanda, representando el nivel de aprovechamiento de la infraestructura eléctrica en función de la estabilidad del consumo (Gonen, 2014)." },
  { sec:"Seleccione la respuesta correcta",
    q:"Según la ecuación de caída de tensión en sistemas trifásicos, ¿qué combinación de parámetros influye directamente en la magnitud de la caída de tensión?",
    opts:["La corriente, la resistencia y la reactancia del conductor.",
           "La potencia activa, la frecuencia y la longitud del circuito.",
           "La tensión nominal, la impedancia y el factor de potencia.",
           "La resistividad, el tipo de material aislante y el número de fases."], a:0,
    fb:"La caída de tensión depende del flujo de corriente y de las propiedades eléctricas del conductor (resistencia y reactancia). Estos parámetros determinan las pérdidas de energía y la eficiencia del sistema de distribución (Wood & Wollenberg, 2012) (Gonen, 2014)." }
];

const $ = s => document.querySelector(s);
const list = $('#list'), countEl = $('#count'), fill = $('#fill'), hint = $('#hint'), result = $('#result');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MARK = '<span class="mark"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">__P__</svg></span>';
const CHECK = MARK.replace('__P__', '<path d="m5 12 5 5 9-10"/>');
const CROSS = MARK.replace('__P__', '<path d="M18 6 6 18M6 6l12 12"/>');
const L = 'abcdefgh';
let answers = [];

function build(){
  answers = new Array(DATA.length).fill(null);
  let prev = null, html = '', t = 0.2;
  DATA.forEach((x, i) => {
    if(x.sec !== prev){
      html += `<div class="sec${prev ? ' later' : ''}" style="animation-delay:${t}s">${esc(x.sec)}</div><br>`;
      prev = x.sec; t += 0.12;
    }
    html += `
    <section class="q" data-i="${i}" style="animation-delay:${t}s" aria-labelledby="h${i}">
      <span class="num">${i + 1}</span>
      <h2 id="h${i}">${esc(x.q)}</h2>
      <div class="opts${x.vf ? ' vf' : ''}" role="group" aria-labelledby="h${i}">
        ${x.opts.map((o, j) => `
          <button class="opt" type="button" data-j="${j}">
            ${x.vf ? '' : `<span class="let">${L[j]}</span>`}
            <span class="txt">${esc(o)}</span>${CHECK.replace('class="mark"','class="mark ck"')}${CROSS.replace('class="mark"','class="mark xx"')}
          </button>`).join('')}
      </div>
      <div class="fb" aria-live="polite"><div><div class="fbin"><strong></strong><p>${esc(x.fb)}</p></div></div></div>
    </section>`;
    t += 0.14;
  });
  list.innerHTML = html;
  /* Cada botón lleva ambos íconos; solo se muestra el que corresponde */
  list.querySelectorAll('.opt .mark.ck').forEach(e => e.style.display = '');
  update();
}

function update(){
  const n = answers.filter(a => a !== null).length;
  countEl.textContent = `${n} de ${DATA.length}`;
  fill.style.width = (n / DATA.length * 100) + '%';
  hint.classList.toggle('used', n > 0);
  if(n === DATA.length){
    const ok = answers.filter((a, i) => a === DATA[i].a).length;
    $('#ring').textContent = `${ok}/${DATA.length}`;
    $('#rTitle').textContent = ok === DATA.length ? '¡Excelente! Respondió todo correctamente.'
      : ok >= Math.ceil(DATA.length * 0.6) ? '¡Buen trabajo! Va por buen camino.'
      : 'Se recomienda repasar los conceptos del módulo.';
    $('#rSub').textContent = `Obtuvo ${ok} de ${DATA.length} respuestas correctas. Puede reintentar cuando lo desee.`;
    setTimeout(() => { result.classList.add('show'); result.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 500);
  }else{
    result.classList.remove('show');
  }
}

function answer(card, j){
  const i = +card.dataset.i, x = DATA[i];
  if(answers[i] !== null) return;
  answers[i] = j;
  const good = j === x.a;
  card.classList.add('done', good ? 'ok' : 'bad');
  card.querySelectorAll('.opt').forEach((b, k) => {
    b.disabled = true;
    const ck = b.querySelector('.ck'), xx = b.querySelector('.xx');
    ck.style.display = 'none'; xx.style.display = 'none';
    if(k === x.a){ b.classList.add('right'); ck.style.display = ''; }
    else if(k === j){ b.classList.add('wrong'); xx.style.display = ''; }
  });
  card.querySelector('.fbin strong').textContent = good ? '¡Respuesta correcta!' : 'Respuesta incorrecta';
  update();
}

list.addEventListener('click', e => {
  const b = e.target.closest('.opt'); if(!b) return;
  answer(b.closest('.q'), +b.dataset.j);
});

$('#reset').addEventListener('click', () => {
  result.classList.remove('show');
  build();
  scrollTo({top:0, behavior:'smooth'});
});

build();
</script>
</body>
</html>
